[package]
name = "ttv-tts-proxy"
description = "TTV-TTS Proxy – makes Voice Creator Pro available to TTV-TTS on other PCs in your network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "ttv_tts_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
ttv-vcp = { workspace = true }
ttv-link = { workspace = true }
ttv-engine = { workspace = true }
ttv-reader = { workspace = true }
ttv-net = { workspace = true }
ttv-plugins = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-window-state = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
keyring = { workspace = true }
sysinfo = { workspace = true }
nvml-wrapper = { workspace = true }
chrono = { workspace = true }
time = { workspace = true }
url = { workspace = true }
socket2 = { workspace = true }
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-autostart = { workspace = true }
