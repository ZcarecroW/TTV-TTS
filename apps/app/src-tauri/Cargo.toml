[package]
name = "ttv-tts"
description = "TTV-TTS – your Twitch chat, read aloud by your own Voice Creator Pro voices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "ttv_tts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
ttv-vcp = { workspace = true }
ttv-link = { workspace = true }
ttv-engine = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-window-state = { workspace = true }
# native open/save dialogs for voice packs (used from Rust only)
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
bytes = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
keyring = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
socket2 = { workspace = true }
if-addrs = { workspace = true }
cpal = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
regex = { workspace = true }
unicode-segmentation = { workspace = true }
sysinfo = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
