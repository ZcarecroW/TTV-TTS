[package]
name = "ttv-reader"
description = "The TTV-TTS chat reader: Twitch chat, text rules, voices, speech, effects and audio outputs (OBS); shared by the app and the proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ttv-vcp = { workspace = true }
ttv-link = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
unicode-segmentation = { workspace = true }
# OBS links (served by the app and the proxy)
axum = { workspace = true }
bytes = { workspace = true }
# FFT for the whisper effect (already in the tree through rubato)
realfft = { workspace = true }

[dev-dependencies]
rustls = { workspace = true }
