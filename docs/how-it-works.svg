<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 900 270" role="img" aria-labelledby="t d">
  <title id="t">How TTV-TTS works</title>
  <desc id="d">Twitch chat and the emote lists feed the OBS browser source ttv-tts.html. It cleans each message, detects the language, picks a voice and asks Voice Creator Pro to speak it. The WAV stream plays into the OBS mixer.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa4b5"/></marker>
  </defs>
  <rect x="-20" y="0" width="900" height="270" rx="16" fill="#0e1015"/>
  <g fill="#1b2030" stroke="#39425a" stroke-width="1.5">
    <rect x="20" y="30" width="190" height="64" rx="10"/>
    <rect x="20" y="140" width="190" height="64" rx="10"/>
    <rect x="310" y="70" width="240" height="110" rx="12" stroke="#8f83ff" stroke-width="2"/>
    <rect x="650" y="30" width="190" height="84" rx="10"/>
    <rect x="650" y="170" width="190" height="64" rx="10"/>
  </g>
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e5e8ef">
    <text x="115" y="58" font-weight="700">Twitch chat</text><text x="115" y="78" fill="#9aa4b5" font-size="12">anonymous IRC WebSocket</text>
    <text x="115" y="168" font-weight="700">Emote lists</text><text x="115" y="188" fill="#9aa4b5" font-size="12">BTTV · FFZ · 7TV</text>
    <text x="430" y="100" font-weight="700">ttv-tts.html</text><text x="430" y="120" fill="#9aa4b5" font-size="12">OBS browser source</text>
    <text x="430" y="142" fill="#9aa4b5" font-size="12">clean → detect language</text><text x="430" y="160" fill="#9aa4b5" font-size="12">→ pick voice → queue</text>
    <text x="745" y="58" font-weight="700">Voice Creator Pro</text><text x="745" y="78" fill="#9aa4b5" font-size="12">REST API · your GPU</text><text x="745" y="96" fill="#9aa4b5" font-size="12">same PC or 2nd PC</text>
    <text x="745" y="198" font-weight="700">OBS mixer</text><text x="745" y="218" fill="#9aa4b5" font-size="12">→ stream &amp; recording</text>
  </g>
  <g stroke="#9aa4b5" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M210 62 L306 100"/><path d="M210 172 L306 150"/>
    <path d="M550 98 L646 70"/><path d="M646 92 L554 118" stroke-dasharray="5 4"/>
    <path d="M550 160 L646 196"/>
  </g>
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#9aa4b5" font-size="12">
    <text x="575" y="66">POST /speak</text><text x="566" y="130">WAV stream</text><text x="572" y="196">audio</text>
  </g>
</svg>
